version: '3.8'

# Services
services:
    # Go Service
    go:
        build:
            dockerfile: ./deployment/local/go/go.dockerfile
        container_name: sacosbego
        volumes:
            - './app:/app'
        ports:
            - 9000:9000
        networks: 
            - backend    
        # depends_on:
        #     - sqlite

    # Nginx Service
    nginx:
        build: 
            dockerfile: ./deployment/local/nginx/nginx.dockerfile
        ports:
            - 8484:80
        links:
            - 'go'
        volumes:
            - './deployment/local/nginx/conf.d:/etc/nginx/conf.d'
            - './logs/nginx/:/var/log/nginx'
            # - './build:/var/www/html'
        networks: 
            - backend        
        depends_on:
            - go
    sqlite:
        build:
            dockerfile: ./deployment/local/sqlite/sqlite.dockerfile
        ports:
            - 3366:3306
        volumes:
            - ./database:/database
        networks: 
            - backend

networks:
    backend:
        driver: bridge    

    


