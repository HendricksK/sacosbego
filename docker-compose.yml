version: '3.8'

# Services
services:

    # Go Service
    go:
        build:
            dockerfile: ./deployment/local/go/go.dockerfile
        depends_on:
            - sqlite

    # Nginx Service
    nginx:
        image: nginx:latest
        ports:
            - 83:80
        links:
            - 'go'
        volumes:
            - './build:/var/www/html'
            - './deployment/local/nginx/conf.d:/etc/nginx/conf.d'
        depends_on:
            - sqlite
    sqlite:
      image: keinos/sqlite3:latest
      ports:
          - 3366:3306
      volumes:
          - sqlitedata:/sqlite/data

# Volumes
volumes:
  sqlitedata:

